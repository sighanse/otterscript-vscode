# =============================================================================
# OtterScript Language Extension - Pre-commit Configuration
# =============================================================================
# Install once with: pre-commit install
#   (installs both the pre-commit and the pre-push hook -- see
#   default_install_hook_types below)
# Run everything by hand with: pre-commit run --all-files
# Run the pre-push checks by hand with: pre-commit run --hook-stage pre-push
#
# Each hook is pinned to a commit (`rev: <sha>  # frozen: <tag>`), like the
# workflows' actions, so a moved tag can't change what runs. Update them all
# with: pre-commit autoupdate --freeze
# -----------------------------------------------------------------------------

# `pre-push` as a stage name needs pre-commit 3.2+.
minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit, pre-push]
# Hooks run at commit time unless they say otherwise (only `npm-check` runs
# at push time). A few pre-commit-hooks entries declare their own stages,
# which beats this default -- those set `stages` explicitly below.
default_stages: [pre-commit]

repos:
  # ---------------------------------------------------------------------------
  # GENERAL FILE CHECKS
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Keep Markdown's two-space hard line breaks.
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
        # The README's demo recording; it isn't packaged (.vscodeignore).
        exclude: ^images/.*\.gif$
        stages: [pre-commit]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: detect-private-key
      - id: forbid-new-submodules
      - id: check-json
        exclude: ^(\.vscode/|snippets/otterscript\.json)
      # Changes reach main through pull requests only.
      - id: no-commit-to-branch
        args: [--branch, main]

  # ---------------------------------------------------------------------------
  # MARKDOWN - MARKDOWNLINT
  # ---------------------------------------------------------------------------
  # markdownlint-cli2 finds .markdownlint.jsonc by itself.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 916ad0aaa108c64d294101002066f530ea170b10  # frozen: v0.23.3
    hooks:
      - id: markdownlint-cli2
        name: Markdownlint
        files: \.md$

  # ---------------------------------------------------------------------------
  # GITHUB ACTIONS - ACTIONLINT (same linter the Lint workflow runs in CI)
  # ---------------------------------------------------------------------------
  # The managed `actionlint` hook builds the pinned version itself, so nothing
  # needs installing first: pre-commit uses Go from PATH if present and
  # downloads it otherwise. The first run takes a minute; later runs are cached.
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  # ---------------------------------------------------------------------------
  # GITHUB ACTIONS - ZIZMOR (the security audit the Lint workflow runs in CI)
  # ---------------------------------------------------------------------------
  # Injection, over-broad permissions, unpinned actions, credentials left in
  # the checkout, ... in the workflows, dependabot.yml and this file. Keep
  # the version the same as the zizmor job's in actionlint.yml.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor

  # ---------------------------------------------------------------------------
  # PROJECT GATES - run the repo's own tooling so pre-commit and CI never diverge
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      # Exactly `npm run lint:ci` (whole repo, cached, --max-warnings=0), so a
      # change to the ESLint config or one file can't break another unnoticed.
      # `--no-install` fails loudly if node_modules is stale instead of pulling
      # a different ESLint into an isolated env.
      - id: eslint
        name: ESLint
        entry: npx --no-install eslint . --cache --max-warnings=0
        language: system
        files: (\.(js|cjs|mjs)$|^package\.json$)
        pass_filenames: false

      # Grammar alternations in syntaxes/otterscript.tmLanguage.json vs the
      # authoritative tables in src/language-data.js (+ the namespace allowlist).
      # Cheap, and guards the drift the sync script exists to catch.
      - id: check-lang-sync
        name: Grammar / language-data sync
        entry: node scripts/check-language-sync.js
        language: system
        pass_filenames: false
        files: ^(src/(language-data|inedo-reference-data|inedo-reference|namespaces)\.js|syntaxes/otterscript\.tmLanguage\.json|scripts/check-language-sync\.js)$

      # Before a push: the full `npm run check` (lint + type check + grammar
      # sync + unit tests), the same gate CI runs. The integration tests stay
      # CI-only -- they launch VS Code and are too slow for a hook.
      - id: npm-check
        name: npm run check
        entry: npm run check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
