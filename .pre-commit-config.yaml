# =============================================================================
# OtterScript Language Extension - Pre-commit Configuration
# =============================================================================
# Run with: pre-commit run --all-files
# Install with: pre-commit install
# -----------------------------------------------------------------------------

repos:
  # ---------------------------------------------------------------------------
  # GENERAL FILE CHECKS
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--allow-multiple-documents']
        exclude: ^mkdocs\.yml$
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: detect-private-key
      - id: forbid-new-submodules
      - id: check-json
        exclude: ^(\.vscode/|snippets/otterscript\.json)
      - id: check-shebang-scripts-are-executable
        files: \.(sh|py)$

  # ---------------------------------------------------------------------------
  # MARKDOWN - MARKDOWNLINT
  # ---------------------------------------------------------------------------
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        name: Markdownlint
        args: [--config .markdownlint.jsonc]
        files: \.md$

  # ---------------------------------------------------------------------------
  # PROJECT GATES - run the repo's own tooling so pre-commit and CI never diverge
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      # Same ESLint, config, cache, and --max-warnings=0 as `npm run lint:ci`.
      # `--no-install` fails loudly if node_modules is stale instead of pulling
      # a different ESLint into an isolated env.
      - id: eslint
        name: ESLint
        entry: npx --no-install eslint --cache --max-warnings=0 --config eslint.config.cjs
        language: system
        files: ^(src|test|scripts)/.*\.js$
        pass_filenames: true

      # Grammar alternations in syntaxes/otterscript.tmLanguage.json vs the
      # authoritative tables in src/language-data.js (+ the namespace allowlist).
      # Cheap, and guards the drift the sync script exists to catch.
      - id: check-lang-sync
        name: Grammar / language-data sync
        entry: node scripts/check-language-sync.js
        language: system
        pass_filenames: false
        files: ^(src/language-data\.js|syntaxes/otterscript\.tmLanguage\.json)$
