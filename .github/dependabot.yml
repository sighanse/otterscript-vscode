version: 2
updates:
  - package-ecosystem: "github-actions"
    open-pull-requests-limit: 10
    directory: "/"
    schedule:
      interval: "weekly"
      time: "08:00"
      timezone: "Europe/Oslo"
    # A week before taking a new release: a hijacked one (such as the
    # rewritten trivy-action tags of March 2026) is usually caught by then.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: "npm"
    open-pull-requests-limit: 10
    directory: "/"
    schedule:
      interval: "weekly"
      time: "08:00"
      timezone: "Europe/Oslo"
    allow:
      - dependency-type: "direct" # Only update top-level packages
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - dependencies
      - npm
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Pinned to the engines.vscode floor (^1.85.0); bump both together, by hand.
      - dependency-name: "@types/vscode"
        versions:
          - ">=1.85.0"
      # Kept on the major of the Node.js that the oldest supported VS Code
      # (engines.vscode) runs -- Node 18 for 1.85 -- so the type check
      # catches newer Node APIs. Minor/patch updates still come through;
      # raise the major by hand together with engines.vscode.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
