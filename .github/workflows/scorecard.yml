name: Scorecard

# OpenSSF Scorecard: rates the repository's security practices (pinned
# actions, branch protection, token permissions, ...). Findings go to the
# Security tab; the results are also published to scorecard.dev for the
# badge. Publishing requires this workflow to stay simple: no `run` steps,
# no workflow-level env or write permissions, only well-known actions.
on:
  # Branch protection is one of the checks.
  branch_protection_rule:
  schedule:
    - cron: '0 6 * * 1'   # Weekly, Monday
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write   # upload the SARIF to code scanning
      id-token: write          # sign the results published to scorecard.dev

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: scorecard
