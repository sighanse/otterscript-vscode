name: Publish Extension

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    # Only ever publish from main -- a manual run on any other branch is skipped.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Both stores trust this environment's OIDC token, so only this job can
    # publish; give the environment a required reviewer to approve each run.
    environment: release
    permissions:
      contents: write # the version tag and GitHub release
      id-token: write # Open VSX trusted publishing; Marketplace sign-in (Entra ID); signing the attestation
      attestations: write # the package's build provenance

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      # Without the packages' install scripts: this job can request an OIDC
      # token (id-token: write), which Open VSX accepts for publishing, and
      # every step can ask for one -- so could the install script of a
      # compromised dependency. Nothing here needs the scripts (esbuild,
      # @vscode/vsce-sign and keytar have them; checking and packaging work
      # without).
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint, type-check, grammar sync, unit tests
        run: npm run check

      # One package, built once: the file checked here is the file both
      # stores get (`vsce publish` and `ovsx publish` would each rebuild it).
      - name: Package extension
        id: package
        run: |
          npm run package
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "vsix=otterscript-vscode-$version.vsix" >> "$GITHUB_OUTPUT"

      # A signed SLSA build provenance attestation for the package: anyone
      # can check that a .vsix was built by this workflow from this
      # repository (`gh attestation verify <file> --repo <owner>/<repo>`;
      # SECURITY.md). Before publishing, so a package without one is never
      # published.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.vsix }}

      # The GitHub release's notes: the version's CHANGELOG.md section. Taken
      # before publishing, so a missing or undated section stops the run
      # before either store gets the package.
      - name: Release notes
        id: notes
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          node scripts/release-notes.js "$VERSION" > "$notes"
          echo "file=$notes" >> "$GITHUB_OUTPUT"

      # The Marketplace takes Microsoft Entra ID instead of a personal access
      # token (global tokens stop working on 2026-12-01): azure/login signs in
      # the Azure CLI with this job's OIDC token, and `vsce --azure-credential`
      # uses that sign-in. No secret is stored. The app's IDs are variables of
      # the release environment, not secrets; CONTRIBUTING.md has the setup.
      # TEMPORARY: while the Marketplace is published to by hand, the
      # variables are unset and both steps are skipped with a warning, so a
      # green run doesn't mean the Marketplace got the release. Once they are
      # set, make a missing one fail the run so a store is never skipped
      # silently.
      - name: Marketplace sign-in not set up
        if: vars.AZURE_CLIENT_ID == '' || vars.AZURE_TENANT_ID == ''
        run: echo "::warning::AZURE_CLIENT_ID or AZURE_TENANT_ID is not set. Skipping the Marketplace"

      - name: Sign in to Microsoft Entra ID
        if: vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # The app only needs the Marketplace, not an Azure subscription.
          allow-no-subscriptions: true

      # --skip-duplicate lets a run that failed half-way be run again.
      - name: Publish to Marketplace
        if: vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != ''
        env:
          VSIX: ${{ steps.package.outputs.vsix }}
        run: |
          npx vsce publish --packagePath "$VSIX" --skip-duplicate --azure-credential

      - name: Publish to Open VSX
        env:
          VSIX: ${{ steps.package.outputs.vsix }}
        run: |
          npx ovsx publish "$VSIX" --skip-duplicate --trusted-publishing

      # Tags the published commit v<version> and attaches the package, with
      # the version's CHANGELOG section as the notes. Skipped when the
      # release exists.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.package.outputs.version }}
          VSIX: ${{ steps.package.outputs.vsix }}
          NOTES: ${{ steps.notes.outputs.file }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"
          else
            gh release create "v$VERSION" "$VSIX" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file "$NOTES"
          fi
