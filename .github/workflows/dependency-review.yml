name: Dependency Review

# Fails a pull request that adds or upgrades to an npm package or action with
# a known vulnerability (GitHub's advisory database). It looks only at what
# the pull request changes; the weekly Security Scan covers what's already in.
on:
  pull_request:
    types: [ opened, synchronize, reopened ] # Skip closed PRs

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # No checkout: the action compares the base and head through the API.
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Same bar as Sanity's npm audit.
          fail-on-severity: moderate
          # Every dependency here is a dev dependency, and they run in CI and
          # in the release job; the default (runtime only) would skip them all.
          fail-on-scopes: runtime, development
          license-check: false
