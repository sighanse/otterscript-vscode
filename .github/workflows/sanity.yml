name: Sanity

on:
  pull_request:
    types: [ opened, synchronize, reopened ] # Skip closed PRs
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read   # list the pull request's commits (attribution check)

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # ============================================================
      # VALIDATION STEPS
      # ============================================================
      # Every check uses continue-on-error so the summary below always shows
      # the full picture; the "Enforce checks" step at the end is what actually
      # fails the job (every check blocks except the informational npm audit).

      - name: ESLint
        id: eslint
        run: npm run lint:ci
        continue-on-error: true

      - name: JS + JSDoc type check
        id: jscheck
        run: npm run check:js
        continue-on-error: true

      - name: Grammar / language-data sync
        id: langsync
        run: npm run check:lang
        continue-on-error: true

      # src/adaptivecard-data.js is generated from scripts/adaptive-card-schema.json
      # and the Teams additions in scripts/update-adaptivecard-data.js.
      - name: Adaptive Card data up to date
        id: cards
        run: npm run check:cards
        continue-on-error: true

      # src/inedo-reference-data.js is generated from scripts/inedo-reference.json.
      - name: Inedo reference data up to date
        id: reference
        run: npm run check:reference
        continue-on-error: true

      # Both bundles (desktop and web) hold only src/ and load only `vscode`:
      # no npm package, and no Node built-in, which the browser doesn't have.
      - name: Bundle contents
        id: bundle
        run: npm run check:bundle
        continue-on-error: true

      # With coverage: also fails when the line, branch or function coverage
      # of src/ falls below the limits in package.json's test:cov. The output
      # is kept for the coverage table in the summary.
      - name: Unit tests
        id: tests
        run: |
          npm run test:cov 2>&1 | tee "$RUNNER_TEMP/unit-tests.txt"
          exit "${PIPESTATUS[0]}"
        continue-on-error: true

      - name: npm security audit
        id: audit
        continue-on-error: true
        run: |
          echo "Running security audit..."
          npm audit --audit-level=moderate

      - name: Validate JSON files
        id: json
        continue-on-error: true
        run: |
          for file in package.json package-lock.json language-configuration.json syntaxes/otterscript.tmLanguage.json; do
            echo "Validating $file..."
            node -e "JSON.parse(require('fs').readFileSync('$file', 'utf8'))"
          done
          echo "✅ JSON validation passed"

      - name: Validate JSONC files
        id: jsonc
        continue-on-error: true
        run: |
          node -e "
            const fs = require('fs');
            const { parse } = require('jsonc-parser');
            const text = fs.readFileSync('snippets/otterscript.json', 'utf8');
            const errors = [];
            parse(text, errors);
            if (errors.length) {
              console.error('JSONC parsing errors:', errors);
              process.exit(1);
            }
            console.log('snippets/otterscript.json is valid');
          "
          echo "✅ JSONC validation passed"

      # No AI attribution in this repository's history (CLAUDE.md): fails on a
      # Co-authored-by trailer naming Claude or Anthropic, or a "Generated with
      # Claude Code" line, in any of the pull request's commits. The agent's
      # commits on GitHub credit the person who asked with a Co-authored-by
      # of their own; that one is allowed (the bot is already the author).
      - name: No attribution trailers in commit messages
        id: trailers
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo "Not a pull request; nothing to check."
            exit 0
          fi
          found=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" \
            --jq '.[] | select(.commit.message | test("(^|\n)co-authored-by:[^\n]*(claude|anthropic)|generated with [[]claude code[]]"; "i")) | "\(.sha[0:7]) \(.commit.message | split("\n")[0])"')
          if [ -n "$found" ]; then
            echo "::error::Commit messages with an attribution trailer (reword them):"
            echo "$found"
            exit 1
          fi
          echo "✅ No attribution trailers"

      - name: Verify LF line endings
        id: lineEndings
        continue-on-error: true
        run: |
          echo "## Line Ending Verification"
          echo ""

          # Check every tracked text file (binaries are skipped by grep -I)
          CRLF_FILES=$(grep -rlI $'\r' --exclude-dir=.git --exclude-dir=.vscode --exclude-dir=.vscode-test --exclude-dir=node_modules . 2>/dev/null || true)

          if [ -n "$CRLF_FILES" ]; then
            echo "❌ Files with CRLF line endings:"
            echo '```'
            echo "$CRLF_FILES"
            echo '```'
            exit 1
          fi

          echo "✅ All source files have LF line endings"

      # Catches manifest / .vscodeignore mistakes before merge rather than in
      # the post-merge Build workflow. Runs after the file checks so the .vsix
      # it writes is not scanned by them.
      - name: Package extension (validation only)
        id: package
        run: npm run package
        continue-on-error: true

      # The VS Code builds the integration tests download (~130 MB each). The
      # key rolls over weekly so a newer "stable" gets cached too; the pinned
      # minimum version is restored from the previous week's cache.
      - name: Compute VS Code cache key
        id: vscodeCacheKey
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache VS Code test builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('.vscode-test.mjs') }}-${{ steps.vscodeCacheKey.outputs.week }}
          restore-keys: |
            vscode-test-${{ runner.os }}-${{ hashFiles('.vscode-test.mjs') }}-

      # Loads the extension in real VS Code (the minimum supported version and
      # current stable) and drives hover, completion, diagnostics, quick fixes
      # and navigation. xvfb provides the display VS Code needs on Linux.
      # With coverage of src/ (through the bundle's source maps), for the
      # summary only: no limits.
      - name: Integration tests
        id: integration
        run: |
          xvfb-run -a npm run test:integration -- --coverage --coverage-reporter text --coverage-output "$RUNNER_TEMP/integration-coverage" 2>&1 | tee "$RUNNER_TEMP/integration-tests.txt"
          exit "${PIPESTATUS[0]}"
        continue-on-error: true

      # Runs the browser bundle (package.json `browser`) in VS Code for the
      # web, in headless Chromium, as vscode.dev and github.dev would. npm
      # doesn't run Playwright's own install script (it isn't in package.json's
      # allowScripts), so the browser is installed here, at the version the
      # lockfile pins.
      - name: Web tests
        id: web
        run: |
          npx --no-install playwright install --with-deps --only-shell chromium
          npm run test:web
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          echo "## Sanity Check Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # ESLint
          if [ "${{ steps.eslint.outcome }}" == "success" ]; then
            echo "✅ ESLint: passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ ESLint: issues found" >> "$GITHUB_STEP_SUMMARY"
          fi

          # JS + JSDoc type check
          if [ "${{ steps.jscheck.outcome }}" == "success" ]; then
            echo "✅ JS + JSDoc type check: passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ JS + JSDoc type check: issues found" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Grammar / language-data sync
          if [ "${{ steps.langsync.outcome }}" == "success" ]; then
            echo "✅ Grammar / language-data sync: passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Grammar / language-data sync: drift detected" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Adaptive Card data
          if [ "${{ steps.cards.outcome }}" == "success" ]; then
            echo "✅ Adaptive Card data: up to date" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Adaptive Card data: stale (regenerate with node scripts/update-adaptivecard-data.js)" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Inedo reference data
          if [ "${{ steps.reference.outcome }}" == "success" ]; then
            echo "✅ Inedo reference data: up to date" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Inedo reference data: stale (regenerate with node scripts/update-inedo-reference.js)" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Bundle contents
          if [ "${{ steps.bundle.outcome }}" == "success" ]; then
            echo "✅ Bundle contents: only src/, loads only vscode" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Bundle contents: an npm package or Node built-in in a bundle" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Unit tests
          if [ "${{ steps.tests.outcome }}" == "success" ]; then
            echo "✅ Unit tests: passed, coverage within its limits" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Unit tests: failed, or coverage below its limits" >> "$GITHUB_STEP_SUMMARY"
          fi

          # JSON
          if [ "${{ steps.json.outcome }}" == "success" ]; then
            echo "✅ JSON validation: passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ JSON validation: failed" >> "$GITHUB_STEP_SUMMARY"
          fi

          # JSONC
          if [ "${{ steps.jsonc.outcome }}" == "success" ]; then
            echo "✅ JSONC validation: passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ JSONC validation: failed" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Line Endings
          if [ "${{ steps.lineEndings.outcome }}" == "success" ]; then
            echo "✅ Line endings: LF" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Line endings: CRLF detected" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Attribution trailers
          if [ "${{ steps.trailers.outcome }}" == "success" ]; then
            echo "✅ Commit messages: no attribution trailers" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Commit messages: attribution trailer found" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Packaging
          if [ "${{ steps.package.outcome }}" == "success" ]; then
            echo "✅ Package: passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Package: failed" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Integration tests
          if [ "${{ steps.integration.outcome }}" == "success" ]; then
            echo "✅ Integration tests: passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Integration tests: failed" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Web tests
          if [ "${{ steps.web.outcome }}" == "success" ]; then
            echo "✅ Web tests: passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Web tests: failed" >> "$GITHUB_STEP_SUMMARY"
          fi

          # npm audit (informational only -- does not block the PR)
          if [ "${{ steps.audit.outcome }}" == "success" ]; then
            echo "✅ npm audit: passed (no vulnerabilities)" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.audit.outcome }}" == "failure" ]; then
            echo "⚠️ npm audit: vulnerability(ies) found (not blocking)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⏭️ npm audit: cancelled/skipped" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The coverage tables the test steps kept, folded under the summary.
      # A step of its own, to keep the Summary script short.
      - name: Coverage tables
        if: always()
        run: |
          # $1: the title, then the table on stdin, folded.
          fold() {
            printf '\n<details><summary>%s</summary>\n\n```text\n' "$1"
            cat
            printf '```\n\n</details>\n'
          }
          if [ -f "$RUNNER_TEMP/unit-tests.txt" ]; then
            sed -n '/start of coverage report/,/end of coverage report/p' "$RUNNER_TEMP/unit-tests.txt" | sed 's/^ℹ //' \
              | fold "Unit test coverage of src/" >> "$GITHUB_STEP_SUMMARY"
          fi
          # The integration table: from its first border line, every line with a column.
          if [ -f "$RUNNER_TEMP/integration-tests.txt" ] && grep -q '^All files' "$RUNNER_TEMP/integration-tests.txt"; then
            awk '/^-+[|]/ { table = 1 } table && /[|]/' "$RUNNER_TEMP/integration-tests.txt" \
              | fold "Integration test coverage of src/ (report only)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Single gate for every blocking check above. A step that did not run
      # (e.g. because `npm ci` failed) reports "skipped" and also fails here.
      - name: Enforce checks
        if: always()
        env:
          OUTCOMES: >-
            ESLint=${{ steps.eslint.outcome }}
            Type-check=${{ steps.jscheck.outcome }}
            Grammar-sync=${{ steps.langsync.outcome }}
            Adaptive-Card-data=${{ steps.cards.outcome }}
            Inedo-reference-data=${{ steps.reference.outcome }}
            Bundle-contents=${{ steps.bundle.outcome }}
            Unit-tests=${{ steps.tests.outcome }}
            JSON=${{ steps.json.outcome }}
            JSONC=${{ steps.jsonc.outcome }}
            Line-endings=${{ steps.lineEndings.outcome }}
            Commit-messages=${{ steps.trailers.outcome }}
            Package=${{ steps.package.outcome }}
            Integration-tests=${{ steps.integration.outcome }}
            Web-tests=${{ steps.web.outcome }}
        run: |
          failed=0
          for entry in $OUTCOMES; do
            name="${entry%%=*}"
            outcome="${entry#*=}"
            if [ "$outcome" != "success" ]; then
              echo "::error::$name: $outcome (see the '$name' step above)"
              failed=1
            else
              echo "$name: ok"
            fi
          done
          exit "$failed"
