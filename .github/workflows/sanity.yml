name: Sanity

on:
  pull_request:
    types: [ opened, synchronize, reopened ] # Skip closed PRs
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # ============================================================
      # VALIDATION STEPS
      # ============================================================

      - name: Validate JavaScript syntax
        id: syntax
        continue-on-error: true
        run: |
          find src -name "*.js" -exec node -c {} \;
          echo "✅ JavaScript Syntax validation passed"

      - name: Validate module exports
        id: exports
        continue-on-error: true
        run: |
          echo "Validating exports..."
          node -e "require('./src/language-data.js')"
          echo "✅ Module Export validation passed"

      - name: ESLint
        id: eslint
        run: npm run lint:ci
        continue-on-error: true

      - name: JS + JSDoc type check
        id: jscheck
        run: npm run check:js
        continue-on-error: true

      - name: Grammar / language-data sync
        id: langsync
        run: npm run check:lang
        continue-on-error: true

      - name: Unit tests
        id: tests
        run: npm test
        continue-on-error: true

      - name: npm security audit
        id: audit
        continue-on-error: true
        run: |
          echo "Running security audit..."
          npm audit --audit-level=moderate

      - name: Validate JSON files
        id: json
        continue-on-error: true
        run: |
          for file in package.json package-lock.json language-configuration.json syntaxes/otterscript.tmLanguage.json; do
            echo "Validating $file..."
            node -e "JSON.parse(require('fs').readFileSync('$file', 'utf8'))"
          done
           echo "✅ JSON validation passed"

      - name: Validate JSONC files
        id: jsonc
        continue-on-error: true
        run: |
          node -e "
            const fs = require('fs');
            const { parse } = require('jsonc-parser');
            const text = fs.readFileSync('snippets/otterscript.json', 'utf8');
            const errors = [];
            parse(text, errors);
            if (errors.length) {
              console.error('JSONC parsing errors:', errors);
              process.exit(1);
            }
            console.log('snippets/otterscript.json is valid');
          "
          echo "✅ JSONC validation passed"

      - name: Verify LF line endings
        id: lineEndings
        continue-on-error: true
        run: |
          echo "## Line Ending Verification"
          echo ""

          # Check src/ files
          CRLF_FILES=$(grep -rlI $'\r' --exclude-dir=.git --exclude-dir=.vscode --exclude-dir=node_modules . 2>/dev/null || true)

          if [ -n "$CRLF_FILES" ]; then
            echo "❌ Files with CRLF line endings:"
            echo '```'
            echo "$CRLF_FILES"
            echo '```'
            exit 1
          fi

          echo "✅ All source files have LF line endings"

      - name: Summary
        if: always()
        run: |
          echo "## Sanity Check Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Syntax
          if [ "${{ steps.syntax.outcome }}" == "success" ]; then
            echo "✅ Syntax validation: passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Syntax validation: failed" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Exports
          if [ "${{ steps.exports.outcome }}" == "success" ]; then
            echo "✅ Module exports: passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Module exports: failed" >> "$GITHUB_STEP_SUMMARY"
          fi

          # ESLint
          if [ "${{ steps.eslint.outcome }}" == "success" ]; then
            echo "✅ ESLint: passed" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.eslint.outcome }}" == "failure" ]; then
            echo "⚠️ ESLint: issues found" >> "$GITHUB_STEP_SUMMARY"
          fi

          # JS + JSDoc type check
          if [ "${{ steps.jscheck.outcome }}" == "success" ]; then
            echo "✅ JS + JSDoc type check: passed" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.jscheck.outcome }}" == "failure" ]; then
            echo "⚠️ JS + JSDoc type check: issues found" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Grammar / language-data sync
          if [ "${{ steps.langsync.outcome }}" == "success" ]; then
            echo "✅ Grammar / language-data sync: passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Grammar / language-data sync: drift detected" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Unit tests
          if [ "${{ steps.tests.outcome }}" == "success" ]; then
            echo "✅ Unit tests: passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Unit tests: failed" >> "$GITHUB_STEP_SUMMARY"
          fi

          # JSON
          if [ "${{ steps.json.outcome }}" == "success" ]; then
            echo "✅ JSON validation: passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ JSON validation: failed" >> "$GITHUB_STEP_SUMMARY"
          fi

          # JSONC
          if [ "${{ steps.jsonc.outcome }}" == "success" ]; then
            echo "✅ JSONC validation: passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ JSONC validation: failed" >> "$GITHUB_STEP_SUMMARY"
          fi

          # npm audit
          if [ "${{ steps.audit.outcome }}" == "success" ]; then
            echo "✅ npm audit: passed (no vulnerabilities)" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.audit.outcome }}" == "failure" ]; then
            echo "⚠️ npm audit: vulnerability(ies) found" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⏭️ npm audit: cancelled/skipped" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Line Endings
          if [ "${{ steps.lineEndings.outcome }}" == "success" ]; then
            echo "✅ Line endings: LF" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Line endings: CRLF detected" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Grammar / language-data drift is treated as a hard failure: highlighting
      # silently breaks when the two fall out of sync, so block the PR on it.
      - name: Enforce grammar / language-data sync
        if: always()
        run: |
          if [ "${{ steps.langsync.outcome }}" != "success" ]; then
            echo "::error::grammar and src/language-data.js are out of sync (see 'Grammar / language-data sync' step)"
            exit 1
          fi
          echo "grammar / language-data sync: ok"

      # Unit tests are a hard failure: they guard the scanner / diagnostics
      # logic that has repeatedly regressed, so block the PR on a red suite.
      - name: Enforce unit tests
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" != "success" ]; then
            echo "::error::unit tests failed (see 'Unit tests' step)"
            exit 1
          fi
          echo "unit tests: ok"

      # Lint and type-check are hard failures too: the repo holds src, tests and
      # scripts to zero ESLint warnings and a clean JSDoc type-check.
      - name: Enforce ESLint
        if: always()
        run: |
          if [ "${{ steps.eslint.outcome }}" != "success" ]; then
            echo "::error::ESLint reported problems (see 'ESLint' step)"
            exit 1
          fi
          echo "eslint: ok"

      - name: Enforce JS + JSDoc type check
        if: always()
        run: |
          if [ "${{ steps.jscheck.outcome }}" != "success" ]; then
            echo "::error::JS + JSDoc type check failed (see 'JS + JSDoc type check' step)"
            exit 1
          fi
          echo "type check: ok"
