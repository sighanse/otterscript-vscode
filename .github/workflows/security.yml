name: Security Scan

on:
  schedule:
    - cron: '0 6 * * 1'   # Weekly Monday scan
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, synchronize, reopened ] # Skip closed PRs


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read          # upload-sarif reads the run's details
      contents: read
      security-events: write # upload the results as code scanning alerts

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1   # a filesystem scan needs no git history
          persist-credentials: false

      # Report-only: findings go to the Security tab (code scanning alerts)
      # instead of failing the run. continue-on-error covers a Trivy crash.
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: '.'
          ignore-unfixed: false
          format: 'sarif'
          output: trivy-results.sarif
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        # Skip (rather than fail) when Trivy crashed before writing its report,
        # and for a pull request from a fork, whose token can't write alerts.
        if: >-
          always() && hashFiles('trivy-results.sarif') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy
